<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">
  <rect width="680" height="260" fill="#fff"/>
  <defs>
    <marker id="a8" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#333">AI时代的TDD循环</text>

  <!-- RED -->
  <rect x="40" y="55" width="180" height="100" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="130" y="82" text-anchor="middle" font-size="20" font-weight="800" fill="#c33">RED</text>
  <text x="130" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#333">人写测试</text>
  <line x1="58" y1="112" x2="202" y2="112" stroke="#ddd" stroke-width="0.8"/>
  <text x="130" y="130" text-anchor="middle" font-size="11" fill="#555">定义"什么算对"</text>
  <text x="130" y="146" text-anchor="middle" font-size="11" fill="#555">测试必须先失败</text>

  <!-- 箭头 RED→GREEN -->
  <line x1="220" y1="105" x2="248" y2="105" stroke="#666" stroke-width="1.5" marker-end="url(#a8)"/>

  <!-- GREEN -->
  <rect x="252" y="55" width="180" height="100" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="342" y="82" text-anchor="middle" font-size="20" font-weight="800" fill="#393">GREEN</text>
  <text x="342" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#333">AI写实现</text>
  <line x1="270" y1="112" x2="414" y2="112" stroke="#ddd" stroke-width="0.8"/>
  <text x="342" y="130" text-anchor="middle" font-size="11" fill="#555">AI生成代码</text>
  <text x="342" y="146" text-anchor="middle" font-size="11" fill="#555">让测试从红变绿</text>

  <!-- 箭头 GREEN→REFACTOR -->
  <line x1="432" y1="105" x2="460" y2="105" stroke="#666" stroke-width="1.5" marker-end="url(#a8)"/>

  <!-- REFACTOR -->
  <rect x="464" y="55" width="180" height="100" rx="5" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="554" y="82" text-anchor="middle" font-size="18" font-weight="800" fill="#555">REFACTOR</text>
  <text x="554" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#333">AI重构 + 人审查</text>
  <line x1="482" y1="112" x2="626" y2="112" stroke="#ddd" stroke-width="0.8"/>
  <text x="554" y="130" text-anchor="middle" font-size="11" fill="#555">AI优化代码结构</text>
  <text x="554" y="146" text-anchor="middle" font-size="11" fill="#555">人审查设计决策</text>

  <!-- 回环箭头 -->
  <path d="M 554 155 L 554 185 Q 554 200 534 200 L 150 200 Q 130 200 130 185 L 130 159"
        fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#a8)"/>
  <text x="342" y="216" text-anchor="middle" font-size="11" fill="#888">下一个需求，回到RED</text>

  <!-- 底部角色分工 -->
  <line x1="100" y1="235" x2="580" y2="235" stroke="#eee" stroke-width="0.8"/>
  <text x="130" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#c33">人</text>
  <text x="342" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#393">AI</text>
  <text x="554" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#555">AI + 人</text>
</svg>
