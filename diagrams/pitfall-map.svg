<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">
  <rect width="800" height="960" fill="#fff"/>
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#222">AI 九个结构性能力陷阱</text>
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#888">按终校图示标注主要 CIVR 动作，具体任务可组合应对</text>
  <!-- ① Almost Right -->
  <rect x="30" y="90" width="234" height="246" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
  <rect x="30" y="90" width="234" height="24" rx="6" fill="#7a8a9a"/>
  <text x="147" y="107" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">下一 token 预测</text>
  <text x="147" y="143" text-anchor="middle" font-size="22" font-weight="700" fill="#222">①</text>
  <text x="147" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Almost Right</text>
  <text x="147" y="189" text-anchor="middle" font-size="14" font-weight="400" fill="#666">差一点就对了</text>
  <text x="147" y="226" text-anchor="middle" font-size="12" font-weight="400" fill="#444">表面看似正确</text>
  <text x="147" y="247" text-anchor="middle" font-size="12" font-weight="400" fill="#444">边界条件失败</text>
  <text x="147" y="268" text-anchor="middle" font-size="12" font-weight="400" fill="#444">逻辑细微错误</text>
  <line x1="50" y1="202" x2="244" y2="202" stroke="#ddd"/>
  <rect x="62" y="292" width="170" height="28" rx="14" fill="#5a3a3a"/>
  <text x="147" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">V 验证</text>
  <!-- ② The Unsaid -->
  <rect x="283" y="90" width="234" height="246" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
  <rect x="283" y="90" width="234" height="24" rx="6" fill="#9a8a6a"/>
  <text x="400" y="107" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">训练数据驱动</text>
  <text x="400" y="143" text-anchor="middle" font-size="22" font-weight="700" fill="#222">②</text>
  <text x="400" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#222">The Unsaid</text>
  <text x="400" y="189" text-anchor="middle" font-size="14" font-weight="400" fill="#666">未言明的信息</text>
  <text x="400" y="226" text-anchor="middle" font-size="12" font-weight="400" fill="#444">不问就动手</text>
  <text x="400" y="247" text-anchor="middle" font-size="12" font-weight="400" fill="#444">遗漏业务规则</text>
  <text x="400" y="268" text-anchor="middle" font-size="12" font-weight="400" fill="#444">缺少隐性知识</text>
  <line x1="303" y1="202" x2="497" y2="202" stroke="#ddd"/>
  <rect x="315" y="292" width="170" height="28" rx="14" fill="#3a4a5a"/>
  <text x="400" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">I 告知</text>
  <!-- ③ Frozen in Time -->
  <rect x="536" y="90" width="234" height="246" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
  <rect x="536" y="90" width="234" height="24" rx="6" fill="#9a8a6a"/>
  <text x="653" y="107" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">训练数据驱动</text>
  <text x="653" y="143" text-anchor="middle" font-size="22" font-weight="700" fill="#222">③</text>
  <text x="653" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Frozen in Time</text>
  <text x="653" y="189" text-anchor="middle" font-size="14" font-weight="400" fill="#666">知识冻结</text>
  <text x="653" y="226" text-anchor="middle" font-size="12" font-weight="400" fill="#444">推荐废弃 API</text>
  <text x="653" y="247" text-anchor="middle" font-size="12" font-weight="400" fill="#444">版本信息过时</text>
  <text x="653" y="268" text-anchor="middle" font-size="12" font-weight="400" fill="#444">与当前文档不符</text>
  <line x1="556" y1="202" x2="750" y2="202" stroke="#ddd"/>
  <rect x="568" y="292" width="170" height="28" rx="14" fill="#3a4a5a"/>
  <text x="653" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">I 告知</text>
  <!-- ④ The Yes-Man -->
  <rect x="30" y="354" width="234" height="246" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
  <rect x="30" y="354" width="234" height="24" rx="6" fill="#9a6a6a"/>
  <text x="147" y="371" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">迎合倾向</text>
  <text x="147" y="407" text-anchor="middle" font-size="22" font-weight="700" fill="#222">④</text>
  <text x="147" y="432" text-anchor="middle" font-size="15" font-weight="700" fill="#222">The Yes-Man</text>
  <text x="147" y="453" text-anchor="middle" font-size="14" font-weight="400" fill="#666">应声虫</text>
  <text x="147" y="490" text-anchor="middle" font-size="12" font-weight="400" fill="#444">顺着错误前提回答</text>
  <text x="147" y="511" text-anchor="middle" font-size="12" font-weight="400" fill="#444">回避必要的质疑</text>
  <text x="147" y="532" text-anchor="middle" font-size="12" font-weight="400" fill="#444">附和用户判断</text>
  <line x1="50" y1="466" x2="244" y2="466" stroke="#ddd"/>
  <rect x="62" y="556" width="170" height="28" rx="14" fill="#5a4a4a"/>
  <text x="147" y="575" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">R 校准</text>
  <!-- ⑤ The Confident Error -->
  <rect x="283" y="354" width="234" height="246" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
  <rect x="283" y="354" width="234" height="24" rx="6" fill="#9a6a6a"/>
  <text x="400" y="371" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">置信表达与正确性</text>
  <text x="400" y="407" text-anchor="middle" font-size="22" font-weight="700" fill="#222">⑤</text>
  <text x="400" y="432" text-anchor="middle" font-size="15" font-weight="700" fill="#222">The Confident Error</text>
  <text x="400" y="453" text-anchor="middle" font-size="14" font-weight="400" fill="#666">自信地犯错</text>
  <text x="400" y="490" text-anchor="middle" font-size="12" font-weight="400" fill="#444">语气笃定但结论错</text>
  <text x="400" y="511" text-anchor="middle" font-size="12" font-weight="400" fill="#444">引用或事实无依据</text>
  <text x="400" y="532" text-anchor="middle" font-size="12" font-weight="400" fill="#444">表达自信不等于可靠</text>
  <line x1="303" y1="466" x2="497" y2="466" stroke="#ddd"/>
  <rect x="315" y="556" width="170" height="28" rx="14" fill="#5a3a3a"/>
  <text x="400" y="575" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">V 验证 / R 校准</text>
  <!-- ⑥ Context Rot -->
  <rect x="536" y="354" width="234" height="246" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
  <rect x="536" y="354" width="234" height="24" rx="6" fill="#7a6a8a"/>
  <text x="653" y="371" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">上下文使用能力</text>
  <text x="653" y="407" text-anchor="middle" font-size="22" font-weight="700" fill="#222">⑥</text>
  <text x="653" y="432" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Context Rot</text>
  <text x="653" y="453" text-anchor="middle" font-size="14" font-weight="400" fill="#666">上下文腐烂</text>
  <text x="653" y="490" text-anchor="middle" font-size="12" font-weight="400" fill="#444">遗漏早期约束</text>
  <text x="653" y="511" text-anchor="middle" font-size="12" font-weight="400" fill="#444">信息增多后表现退化</text>
  <text x="653" y="532" text-anchor="middle" font-size="12" font-weight="400" fill="#444">输出前后矛盾</text>
  <line x1="556" y1="466" x2="750" y2="466" stroke="#ddd"/>
  <rect x="568" y="556" width="170" height="28" rx="14" fill="#3a4a5a"/>
  <text x="653" y="575" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">I 告知</text>
  <!-- ⑦ Goldfish Memory -->
  <rect x="30" y="618" width="234" height="246" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
  <rect x="30" y="618" width="234" height="24" rx="6" fill="#7a6a8a"/>
  <text x="147" y="635" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">跨会话上下文</text>
  <text x="147" y="671" text-anchor="middle" font-size="22" font-weight="700" fill="#222">⑦</text>
  <text x="147" y="696" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Goldfish Memory</text>
  <text x="147" y="717" text-anchor="middle" font-size="14" font-weight="400" fill="#666">金鱼记忆</text>
  <text x="147" y="754" text-anchor="middle" font-size="12" font-weight="400" fill="#444">新会话缺少旧决策</text>
  <text x="147" y="775" text-anchor="middle" font-size="12" font-weight="400" fill="#444">重复询问背景</text>
  <text x="147" y="796" text-anchor="middle" font-size="12" font-weight="400" fill="#444">方案前后不一致</text>
  <line x1="50" y1="730" x2="244" y2="730" stroke="#ddd"/>
  <rect x="62" y="820" width="170" height="28" rx="14" fill="#3a4a5a"/>
  <text x="147" y="839" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">I 告知</text>
  <!-- ⑧ Error Snowball -->
  <rect x="283" y="618" width="234" height="246" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
  <rect x="283" y="618" width="234" height="24" rx="6" fill="#5a7a6a"/>
  <text x="400" y="635" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Agent 多步执行</text>
  <text x="400" y="671" text-anchor="middle" font-size="22" font-weight="700" fill="#222">⑧</text>
  <text x="400" y="696" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Error Snowball</text>
  <text x="400" y="717" text-anchor="middle" font-size="14" font-weight="400" fill="#666">误差雪球</text>
  <text x="400" y="754" text-anchor="middle" font-size="12" font-weight="400" fill="#444">小错逐步被放大</text>
  <text x="400" y="775" text-anchor="middle" font-size="12" font-weight="400" fill="#444">后续依赖错误结果</text>
  <text x="400" y="796" text-anchor="middle" font-size="12" font-weight="400" fill="#444">多步任务越走越偏</text>
  <line x1="303" y1="730" x2="497" y2="730" stroke="#ddd"/>
  <rect x="315" y="820" width="170" height="28" rx="14" fill="#3a3a4a"/>
  <text x="400" y="839" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">C 约束</text>
  <!-- ⑨ Toolbox Paradox -->
  <rect x="536" y="618" width="234" height="246" rx="6" fill="#fff" stroke="#666" stroke-width="1.2"/>
  <rect x="536" y="618" width="234" height="24" rx="6" fill="#5a7a6a"/>
  <text x="653" y="635" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">工具选择与编排</text>
  <text x="653" y="671" text-anchor="middle" font-size="22" font-weight="700" fill="#222">⑨</text>
  <text x="653" y="696" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Toolbox Paradox</text>
  <text x="653" y="717" text-anchor="middle" font-size="14" font-weight="400" fill="#666">工具箱悖论</text>
  <text x="653" y="754" text-anchor="middle" font-size="12" font-weight="400" fill="#444">选择负担增加</text>
  <text x="653" y="775" text-anchor="middle" font-size="12" font-weight="400" fill="#444">无关调用干扰任务</text>
  <text x="653" y="796" text-anchor="middle" font-size="12" font-weight="400" fill="#444">调用链过长</text>
  <line x1="556" y1="730" x2="750" y2="730" stroke="#ddd"/>
  <rect x="568" y="820" width="170" height="28" rx="14" fill="#3a3a4a"/>
  <text x="653" y="839" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">C 约束</text>
  <rect x="30" y="898" width="740" height="44" fill="#f5f5f5" stroke="#bbb" stroke-dasharray="3 3"/>
  <text x="400" y="917" text-anchor="middle" font-size="12" fill="#444">标签是书中主要动作映射，不表示每个陷阱只有一种应对方式。</text>
  <text x="400" y="934" text-anchor="middle" font-size="12" fill="#666">症状用于引导排查，不能单独作为确定诊断。</text>
</svg>
