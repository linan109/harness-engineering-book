<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">
  <rect width="900" height="560" fill="#fff"/>

  <!-- 标题 -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#222">推荐阅读 · 四张书单</text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#888">软件工程经典 · AI 与机器学习 · Harness Engineering · 延伸思考</text>

  <!-- 资源类型图例 -->
  <g font-size="11">
    <rect x="280" y="78" width="36" height="18" rx="3" fill="#222"/>
    <text x="298" y="91" text-anchor="middle" font-weight="700" fill="#fff">书</text>
    <text x="322" y="91" text-anchor="start" fill="#666">著作</text>

    <rect x="380" y="78" width="36" height="18" rx="3" fill="#666"/>
    <text x="398" y="91" text-anchor="middle" font-weight="700" fill="#fff">论文</text>
    <text x="422" y="91" text-anchor="start" fill="#666">学术</text>

    <rect x="480" y="78" width="36" height="18" rx="3" fill="#fff" stroke="#888" stroke-width="1"/>
    <text x="498" y="91" text-anchor="middle" font-weight="700" fill="#444">博客</text>
    <text x="522" y="91" text-anchor="start" fill="#666">在线文章</text>

    <rect x="600" y="78" width="36" height="18" rx="3" fill="#fff" stroke="#888" stroke-width="1" stroke-dasharray="2 2"/>
    <text x="618" y="91" text-anchor="middle" font-weight="700" fill="#444">视频</text>
    <text x="642" y="91" text-anchor="start" fill="#666">在线课程</text>
  </g>

  <!-- 4 列布局：x=20/240/460/680，每列宽 200，间距 20 -->

  <!-- ============ 列 1：软件工程经典 ============ -->
  <rect x="20" y="115" width="200" height="40" rx="4" fill="#3a4a5a" stroke="#1a2a3a" stroke-width="1"/>
  <text x="120" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">软件工程经典</text>

  <rect x="20" y="155" width="200" height="370" fill="#fafafa" stroke="#999" stroke-width="1"/>

  <!-- 1: 人月神话 -->
  <rect x="32" y="170" width="32" height="16" rx="3" fill="#222"/>
  <text x="48" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">书</text>
  <text x="72" y="182" text-anchor="start" font-size="13" font-weight="700" fill="#222">人月神话</text>
  <text x="32" y="200" text-anchor="start" font-size="11" fill="#777">Frederick Brooks</text>

  <!-- 2: 设计模式 -->
  <rect x="32" y="218" width="32" height="16" rx="3" fill="#222"/>
  <text x="48" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">书</text>
  <text x="72" y="230" text-anchor="start" font-size="13" font-weight="700" fill="#222">设计模式</text>
  <text x="32" y="248" text-anchor="start" font-size="11" fill="#777">GoF (Gang of Four)</text>

  <!-- 3: 重构 -->
  <rect x="32" y="266" width="32" height="16" rx="3" fill="#222"/>
  <text x="48" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">书</text>
  <text x="72" y="278" text-anchor="start" font-size="13" font-weight="700" fill="#222">重构</text>
  <text x="32" y="296" text-anchor="start" font-size="11" fill="#777">Martin Fowler</text>

  <!-- 4: 持续交付 -->
  <rect x="32" y="314" width="32" height="16" rx="3" fill="#222"/>
  <text x="48" y="326" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">书</text>
  <text x="72" y="326" text-anchor="start" font-size="13" font-weight="700" fill="#222">持续交付</text>
  <text x="32" y="344" text-anchor="start" font-size="11" fill="#777">Humble · Farley</text>

  <!-- 5: 凤凰项目 -->
  <rect x="32" y="362" width="32" height="16" rx="3" fill="#222"/>
  <text x="48" y="374" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">书</text>
  <text x="72" y="374" text-anchor="start" font-size="13" font-weight="700" fill="#222">凤凰项目</text>
  <text x="32" y="392" text-anchor="start" font-size="11" fill="#777">Gene Kim 等</text>

  <line x1="32" y1="490" x2="208" y2="490" stroke="#ddd" stroke-width="1"/>
  <text x="120" y="510" text-anchor="middle" font-size="11" font-style="italic" fill="#888">夯实基本功</text>

