  <rect x="240" y="155" width="200" height="370" fill="#fafafa" stroke="#999" stroke-width="1"/>

  <!-- 1: Attention论文 -->
  <rect x="252" y="170" width="32" height="16" rx="3" fill="#666"/>
  <text x="268" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">论文</text>
  <text x="292" y="182" text-anchor="start" font-size="13" font-weight="700" fill="#222">Attention Is All</text>
  <text x="292" y="195" text-anchor="start" font-size="13" font-weight="700" fill="#222">You Need</text>
  <text x="252" y="213" text-anchor="start" font-size="11" fill="#777">Vaswani et al., 2017</text>

  <!-- 2: ReAct论文 -->
  <rect x="252" y="231" width="32" height="16" rx="3" fill="#666"/>
  <text x="268" y="243" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">论文</text>
  <text x="292" y="243" text-anchor="start" font-size="13" font-weight="700" fill="#222">ReAct</text>
  <text x="252" y="261" text-anchor="start" font-size="11" fill="#777">Yao et al., 2022</text>

  <!-- 3: 动手学深度学习 -->
  <rect x="252" y="279" width="32" height="16" rx="3" fill="#222"/>
  <text x="268" y="291" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">书</text>
  <text x="292" y="291" text-anchor="start" font-size="13" font-weight="700" fill="#222">动手学深度学习</text>
  <text x="252" y="309" text-anchor="start" font-size="11" fill="#777">李沐 等</text>

  <!-- 4: Karpathy视频 -->
  <rect x="252" y="327" width="32" height="16" rx="3" fill="#fff" stroke="#666" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="268" y="339" text-anchor="middle" font-size="10" font-weight="700" fill="#333">视频</text>
  <text x="292" y="339" text-anchor="start" font-size="13" font-weight="700" fill="#222">从零构建 GPT</text>
  <text x="252" y="357" text-anchor="start" font-size="11" fill="#777">Karpathy YouTube</text>

  <line x1="252" y1="490" x2="428" y2="490" stroke="#ddd" stroke-width="1"/>
  <text x="340" y="510" text-anchor="middle" font-size="11" font-style="italic" fill="#888">理解 AI 是什么</text>

  <!-- ============ 列 3：Harness Engineering ============ -->
  <rect x="460" y="115" width="200" height="40" rx="4" fill="#5a3a3a" stroke="#3a1a1a" stroke-width="1"/>
  <text x="560" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Harness Engineering</text>

  <rect x="460" y="155" width="200" height="370" fill="#fafafa" stroke="#999" stroke-width="1"/>

  <!-- 1: OpenAI Codex -->
  <rect x="472" y="170" width="32" height="16" rx="3" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="488" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#444">博客</text>
  <text x="512" y="182" text-anchor="start" font-size="12" font-weight="700" fill="#222">Leveraging Codex</text>
  <text x="472" y="200" text-anchor="start" font-size="11" fill="#777">OpenAI · 核心参考</text>

  <!-- 2: Anthropic -->
  <rect x="472" y="218" width="32" height="16" rx="3" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="488" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#444">博客</text>
  <text x="512" y="230" text-anchor="start" font-size="12" font-weight="700" fill="#222">Effective Harnesses</text>
  <text x="472" y="248" text-anchor="start" font-size="11" fill="#777">Anthropic</text>

  <!-- 3: Fowler -->
  <rect x="472" y="266" width="32" height="16" rx="3" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="488" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#444">博客</text>
  <text x="512" y="278" text-anchor="start" font-size="12" font-weight="700" fill="#222">Harness Engineering</text>
  <text x="472" y="296" text-anchor="start" font-size="11" fill="#777">Fowler · Bockeler</text>

  <!-- 4: Kozyrkov -->
  <rect x="472" y="314" width="32" height="16" rx="3" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="488" y="326" text-anchor="middle" font-size="10" font-weight="700" fill="#444">博客</text>
  <text x="512" y="326" text-anchor="start" font-size="12" font-weight="700" fill="#222">Supervise Code...</text>
  <text x="472" y="344" text-anchor="start" font-size="11" fill="#777">Cassie Kozyrkov</text>

  <!-- 5: Mirji -->
  <rect x="472" y="362" width="32" height="16" rx="3" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="488" y="374" text-anchor="middle" font-size="10" font-weight="700" fill="#444">博客</text>
  <text x="512" y="374" text-anchor="start" font-size="12" font-weight="700" fill="#222">Build the Harness</text>
  <text x="472" y="392" text-anchor="start" font-size="11" fill="#777">Vitthal Mirji</text>

  <!-- 6: 12-Factor Agents -->
  <rect x="472" y="410" width="32" height="16" rx="3" fill="#fff" stroke="#888" stroke-width="1"/>
  <text x="488" y="422" text-anchor="middle" font-size="10" font-weight="700" fill="#444">博客</text>
  <text x="512" y="422" text-anchor="start" font-size="12" font-weight="700" fill="#222">12-Factor Agents</text>
  <text x="472" y="440" text-anchor="start" font-size="11" fill="#777">Dex Horthy</text>

  <line x1="472" y1="490" x2="648" y2="490" stroke="#ddd" stroke-width="1"/>
  <text x="560" y="510" text-anchor="middle" font-size="11" font-style="italic" fill="#888">本书的方法论源头</text>

  <!-- ============ 列 4：延伸思考 ============ -->
  <rect x="680" y="115" width="200" height="40" rx="4" fill="#3a5a3a" stroke="#1a3a1a" stroke-width="1"/>
  <text x="780" y="141" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">延伸思考</text>

  <rect x="680" y="155" width="200" height="370" fill="#fafafa" stroke="#999" stroke-width="1"/>

  <!-- 1: 思考快与慢 -->
  <rect x="692" y="170" width="32" height="16" rx="3" fill="#222"/>
  <text x="708" y="182" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">书</text>
  <text x="732" y="182" text-anchor="start" font-size="13" font-weight="700" fill="#222">思考，快与慢</text>
  <text x="692" y="200" text-anchor="start" font-size="11" fill="#777">Daniel Kahneman</text>

  <!-- 2: 反脆弱 -->
  <rect x="692" y="218" width="32" height="16" rx="3" fill="#222"/>
  <text x="708" y="230" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">书</text>
  <text x="732" y="230" text-anchor="start" font-size="13" font-weight="700" fill="#222">反脆弱</text>
  <text x="692" y="248" text-anchor="start" font-size="11" fill="#777">Nassim Taleb</text>

  <!-- 3: 清单革命 -->
  <rect x="692" y="266" width="32" height="16" rx="3" fill="#222"/>
  <text x="708" y="278" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">书</text>
  <text x="732" y="278" text-anchor="start" font-size="13" font-weight="700" fill="#222">清单革命</text>
  <text x="692" y="296" text-anchor="start" font-size="11" fill="#777">Atul Gawande</text>

  <line x1="692" y1="490" x2="868" y2="490" stroke="#ddd" stroke-width="1"/>
  <text x="780" y="510" text-anchor="middle" font-size="11" font-style="italic" fill="#888">跳出技术看技术</text>

  <!-- 底部 -->
  <text x="450" y="548" text-anchor="middle" font-size="11" fill="#aaa">推荐理由见同名文档，学习资源链接见参考资料</text>
</svg>
