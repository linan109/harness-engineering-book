<svg xmlns="http://www.w3.org/2000/svg" width="580" height="420" viewBox="0 0 580 420" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">
  <rect width="580" height="420" fill="#fff"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#333">AI编程工具全景坐标系</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="370" x2="550" y2="370" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="50" x2="80" y2="370" stroke="#333" stroke-width="1.5"/>

  <!-- X轴标签 -->
  <text x="315" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#333">自主程度</text>
  <text x="100" y="390" text-anchor="start" font-size="10" fill="#aaa">低 (你打字它预测)</text>
  <text x="540" y="390" text-anchor="end" font-size="10" fill="#aaa">高 (独立完成任务)</text>

  <!-- Y轴标签 -->
  <text x="28" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#333" transform="rotate(-90, 28, 210)">Harness需求度</text>
  <text x="68" y="365" text-anchor="end" font-size="10" fill="#aaa">低</text>
  <text x="68" y="60" text-anchor="end" font-size="10" fill="#aaa">高</text>

  <!-- 对角趋势线 -->
  <line x1="100" y1="350" x2="530" y2="70" stroke="#ddd" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="500" y="60" text-anchor="end" font-size="10" fill="#aaa">越自主越需要驾驭</text>

  <!-- 代码补全 -->
  <rect x="105" y="300" width="110" height="50" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="160" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#333">代码补全</text>
  <text x="160" y="340" text-anchor="middle" font-size="10" fill="#888">GitHub Copilot</text>

  <!-- IDE Agent -->
  <rect x="220" y="190" width="110" height="50" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="275" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#333">IDE Agent</text>
  <text x="275" y="230" text-anchor="middle" font-size="10" fill="#888">Cursor, TRAE</text>

  <!-- CLI Agent -->
  <rect x="300" y="137" width="145" height="50" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="372" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#333">CLI Agent</text>
  <text x="372" y="176" text-anchor="middle" font-size="10" fill="#888">Claude Code, Codex CLI</text>

  <!-- 云端Agent -->
  <rect x="390" y="76" width="170" height="56" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="475" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#333">云端Agent</text>
  <text x="475" y="110" text-anchor="middle" font-size="10" fill="#888">Devin</text>
  <text x="475" y="124" text-anchor="middle" font-size="10" fill="#888">Copilot Coding Agent</text>

  <!-- 平台型 -->
  <rect x="170" y="260" width="120" height="44" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
  <text x="230" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#666">平台型</text>
  <text x="230" y="296" text-anchor="middle" font-size="9" fill="#888">Replit Agent, Bolt.new</text>

  <!-- 底部 -->
  <text x="290" y="414" text-anchor="middle" font-size="11" fill="#aaa">示意位置不代表固定排名；按任务、权限与失败后果选择模式。</text>
</svg>
